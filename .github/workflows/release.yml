name: Publish to PyPI

# Manual publication of a tagged release to PyPI through Trusted Publishing (no API token).
# Prerequisites, done once on pypi.org: register this repository as a pending trusted publisher
# for the project compass-refine (owner M-Lab-Repo, repository compass, workflow release.yml,
# environment pypi). Then run this workflow from the Actions tab with the tag to publish.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to build and publish (for example v0.3.0)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
