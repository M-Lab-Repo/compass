<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 360" role="img" aria-label="figure4/: what runs in which order and what each step writes"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16202c"/></marker></defs><rect x="0" y="0" width="1020" height="360" fill="#ffffff"/><text x="20" y="20" font-family="DejaVu Sans" font-size="14" font-weight="bold" fill="#16202c">figure4/: what runs in which order and what each step writes</text><text x="20" y="38" font-family="DejaVu Sans" font-size="12" font-weight="bold" fill="#5b6472">1  run</text><text x="270" y="38" font-family="DejaVu Sans" font-size="12" font-weight="bold" fill="#5b6472">2  score</text><text x="520" y="38" font-family="DejaVu Sans" font-size="12" font-weight="bold" fill="#5b6472">3  create</text><rect x="20" y="56" width="230" height="112" rx="6" fill="#fff8e6" stroke="#16202c" stroke-width="1"/><text x="30" y="78" font-family="DejaVu Sans Mono" font-weight="bold" font-size="13" fill="#16202c">figure4_run.py</text><text x="30" y="94" font-family="DejaVu Sans" font-size="11" fill="#5b6472">figure2's engine on five census arms</text><text x="30" y="108" font-family="DejaVu Sans" font-size="11" fill="#5b6472">(four misspecified-baseline arms,</text><text x="30" y="122" font-family="DejaVu Sans" font-size="11" fill="#5b6472">real data at default budget): writes</text><text x="30" y="136" font-family="DejaVu Sans" font-size="11" fill="#5b6472">runs/&lt;arm&gt;/&lt;run&gt;.json, each with</text><text x="30" y="150" font-family="DejaVu Sans" font-size="11" fill="#5b6472">a cost block</text><rect x="270" y="56" width="230" height="112" rx="6" fill="#fff8e6" stroke="#16202c" stroke-width="1"/><text x="280" y="78" font-family="DejaVu Sans Mono" font-weight="bold" font-size="13" fill="#16202c">figure4_score.py</text><text x="280" y="94" font-family="DejaVu Sans" font-size="11" fill="#5b6472">optional: figure2's scoring writes</text><text x="280" y="108" font-family="DejaVu Sans" font-size="11" fill="#5b6472">scores/&lt;run&gt;.json; the fit seconds</text><text x="280" y="122" font-family="DejaVu Sans" font-size="11" fill="#5b6472">stored there feed the panel's</text><text x="280" y="136" font-family="DejaVu Sans" font-size="11" fill="#5b6472">footnote</text><rect x="520" y="56" width="230" height="112" rx="6" fill="#f4f6f9" stroke="#16202c" stroke-width="1"/><text x="530" y="78" font-family="DejaVu Sans Mono" font-weight="bold" font-size="13" fill="#16202c">figure4_create.py</text><text x="530" y="94" font-family="DejaVu Sans" font-size="11" fill="#5b6472">reads the cost blocks; prints</text><text x="530" y="108" font-family="DejaVu Sans" font-size="11" fill="#5b6472">verdicts, seconds and tokens per</text><text x="530" y="122" font-family="DejaVu Sans" font-size="11" fill="#5b6472">rule; writes figure4.png (one block</text><text x="530" y="136" font-family="DejaVu Sans" font-size="11" fill="#5b6472">per directory given)</text><line x1="250" y1="112.0" x2="268" y2="112.0" stroke="#16202c" stroke-width="1.4" marker-end="url(#arr)"/><line x1="500" y1="112.0" x2="518" y2="112.0" stroke="#16202c" stroke-width="1.4" marker-end="url(#arr)"/><text x="20" y="206" font-family="DejaVu Sans" font-size="12" font-weight="bold" fill="#5b6472">imported by every step</text><rect x="20" y="218" width="980" height="34" rx="6" fill="#eef7f1" stroke="#16202c" stroke-width="1"/><text x="30" y="240" font-family="DejaVu Sans Mono" font-weight="bold" font-size="13" fill="#16202c">figure2/figure2_protocols.py</text><text x="290" y="239" font-family="DejaVu Sans" font-size="11" fill="#5b6472">the table of census arms; figure4_run.py names the five it needs</text><rect x="20" y="262" width="980" height="34" rx="6" fill="#eef7f1" stroke="#16202c" stroke-width="1"/><text x="30" y="284" font-family="DejaVu Sans Mono" font-weight="bold" font-size="13" fill="#16202c">figure2/figure2_run.py</text><text x="290" y="283" font-family="DejaVu Sans" font-size="11" fill="#5b6472">the census engine; its Ledger records what every stage and every rule cost in the record's cost block</text><rect x="20" y="306" width="980" height="34" rx="6" fill="#eef7f1" stroke="#16202c" stroke-width="1"/><text x="30" y="328" font-family="DejaVu Sans Mono" font-weight="bold" font-size="13" fill="#16202c">figure2/figure2_common.py</text><text x="290" y="327" font-family="DejaVu Sans" font-size="11" fill="#5b6472">reading records, rule names and colours</text></svg>