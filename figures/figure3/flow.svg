<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 732" role="img" aria-label="figure3/: what runs in which order and what each step writes"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16202c"/></marker></defs><rect x="0" y="0" width="1020" height="732" fill="#ffffff"/><text x="20" y="20" font-family="DejaVu Sans" font-size="14" font-weight="bold" fill="#16202c">figure3/: what runs in which order and what each step writes</text><text x="20" y="38" font-family="DejaVu Sans" font-size="12" font-weight="bold" fill="#5b6472">1  run</text><text x="270" y="38" font-family="DejaVu Sans" font-size="12" font-weight="bold" fill="#5b6472">2  score</text><text x="520" y="38" font-family="DejaVu Sans" font-size="12" font-weight="bold" fill="#5b6472">3  create</text><text x="770" y="38" font-family="DejaVu Sans" font-size="12" font-weight="bold" fill="#5b6472">4  compose</text><rect x="20" y="56" width="230" height="112" rx="6" fill="#fff8e6" stroke="#16202c" stroke-width="1"/><text x="30" y="78" font-family="DejaVu Sans Mono" font-weight="bold" font-size="13" fill="#16202c">figure3a_run.py</text><text x="30" y="94" font-family="DejaVu Sans" font-size="11" fill="#5b6472">writes</text><text x="30" y="108" font-family="DejaVu Sans" font-size="11" fill="#5b6472">runs/&lt;arm&gt;/drift/&lt;type&gt;_seed0_&lt;rule&gt;.json:</text><text x="30" y="122" font-family="DejaVu Sans" font-size="11" fill="#5b6472">32 raw trajectories (8 problems x 4</text><text x="30" y="136" font-family="DejaVu Sans" font-size="11" fill="#5b6472">rules, 6 rounds each);</text><text x="30" y="150" font-family="DejaVu Sans" font-size="11" fill="#5b6472">figure3b_run.py is the same arm</text><rect x="270" y="56" width="230" height="112" rx="6" fill="#fff8e6" stroke="#16202c" stroke-width="1"/><text x="280" y="78" font-family="DejaVu Sans Mono" font-weight="bold" font-size="13" fill="#16202c">figure3a_score.py</text><text x="280" y="94" font-family="DejaVu Sans" font-size="11" fill="#5b6472">writes drift/scores/&lt;trajectory&gt;.json:</text><text x="280" y="108" font-family="DejaVu Sans" font-size="11" fill="#5b6472">per round, the deployed model vs.</text><text x="280" y="122" font-family="DejaVu Sans" font-size="11" fill="#5b6472">the start on the hidden fold and the</text><text x="280" y="136" font-family="DejaVu Sans" font-size="11" fill="#5b6472">fresh draw, the candidate vs. its</text><text x="280" y="150" font-family="DejaVu Sans" font-size="11" fill="#5b6472">baseline</text><rect x="520" y="56" width="230" height="112" rx="6" fill="#f4f6f9" stroke="#16202c" stroke-width="1"/><text x="530" y="78" font-family="DejaVu Sans Mono" font-weight="bold" font-size="13" fill="#16202c">figure3a_create.py</text><text x="530" y="94" font-family="DejaVu Sans" font-size="11" fill="#5b6472">reads the trajectories + scores;</text><text x="530" y="108" font-family="DejaVu Sans" font-size="11" fill="#5b6472">prints the medians by round; writes</text><text x="530" y="122" font-family="DejaVu Sans" font-size="11" fill="#5b6472">figure3a.png (or .pdf)</text><rect x="770" y="56" width="230" height="112" rx="6" fill="#f4f6f9" stroke="#16202c" stroke-width="1"/><text x="780" y="78" font-family="DejaVu Sans Mono" font-weight="bold" font-size="13" fill="#16202c">figure3_compose.py</text><text x="780" y="94" font-family="DejaVu Sans" font-size="11" fill="#5b6472">lays a, b, c, d (and e) out on one</text><text x="780" y="108" font-family="DejaVu Sans" font-size="11" fill="#5b6472">sheet: figure3.png or figure3.pdf</text><text x="780" y="122" font-family="DejaVu Sans" font-size="11" fill="#5b6472">with editable text</text><line x1="250" y1="112" x2="268" y2="112" stroke="#16202c" stroke-width="1.4" marker-end="url(#arr)"/><line x1="500" y1="112" x2="518" y2="112" stroke="#16202c" stroke-width="1.4" marker-end="url(#arr)"/><line x1="750" y1="112" x2="768" y2="112" stroke="#16202c" stroke-width="1.4" marker-end="url(#arr)"/><rect x="520" y="186" width="230" height="98" rx="6" fill="#f4f6f9" stroke="#16202c" stroke-width="1"/><text x="530" y="208" font-family="DejaVu Sans Mono" font-weight="bold" font-size="13" fill="#16202c">figure3b_create.py</text><text x="530" y="224" font-family="DejaVu Sans" font-size="11" fill="#5b6472">reads the same raw trajectories, no</text><text x="530" y="238" font-family="DejaVu Sans" font-size="11" fill="#5b6472">scores needed; prints changed</text><text x="530" y="252" font-family="DejaVu Sans" font-size="11" fill="#5b6472">rounds and site counts; writes</text><text x="530" y="266" font-family="DejaVu Sans" font-size="11" fill="#5b6472">figure3b.png</text><rect x="20" y="302" width="230" height="98" rx="6" fill="#fff8e6" stroke="#16202c" stroke-width="1"/><text x="30" y="324" font-family="DejaVu Sans Mono" font-weight="bold" font-size="13" fill="#16202c">figure3c_run.py</text><text x="30" y="340" font-family="DejaVu Sans" font-size="11" fill="#5b6472">figure2's engine on one census</text><text x="30" y="354" font-family="DejaVu Sans" font-size="11" fill="#5b6472">arm: writes</text><text x="30" y="368" font-family="DejaVu Sans" font-size="11" fill="#5b6472">runs/&lt;arm&gt;/&lt;dataset&gt;_seed0[_s&lt;split&gt;]_r1.json,</text><text x="30" y="382" font-family="DejaVu Sans" font-size="11" fill="#5b6472">21 raw records</text><rect x="270" y="302" width="230" height="98" rx="6" fill="#fff8e6" stroke="#16202c" stroke-width="1"/><text x="280" y="324" font-family="DejaVu Sans Mono" font-weight="bold" font-size="13" fill="#16202c">figure3c_score.py</text><text x="280" y="340" font-family="DejaVu Sans" font-size="11" fill="#5b6472">figure2's scoring: writes</text><text x="280" y="354" font-family="DejaVu Sans" font-size="11" fill="#5b6472">scores/&lt;run&gt;.json (hidden-fold</text><text x="280" y="368" font-family="DejaVu Sans" font-size="11" fill="#5b6472">labels) and readers/&lt;run&gt;.json</text><text x="280" y="382" font-family="DejaVu Sans" font-size="11" fill="#5b6472">(GPT-5 reader on the real-data arm)</text><rect x="520" y="302" width="230" height="98" rx="6" fill="#f4f6f9" stroke="#16202c" stroke-width="1"/><text x="530" y="324" font-family="DejaVu Sans Mono" font-weight="bold" font-size="13" fill="#16202c">figure3c_create.py</text><text x="530" y="340" font-family="DejaVu Sans" font-size="11" fill="#5b6472">reads the arm; prints the</text><text x="530" y="354" font-family="DejaVu Sans" font-size="11" fill="#5b6472">first-accepted outcome per dataset</text><text x="530" y="368" font-family="DejaVu Sans" font-size="11" fill="#5b6472">and rule; writes figure3c.png</text><line x1="250" y1="351" x2="268" y2="351" stroke="#16202c" stroke-width="1.4" marker-end="url(#arr)"/><line x1="500" y1="351" x2="518" y2="351" stroke="#16202c" stroke-width="1.4" marker-end="url(#arr)"/><rect x="20" y="418" width="230" height="98" rx="6" fill="#fff8e6" stroke="#16202c" stroke-width="1"/><text x="30" y="440" font-family="DejaVu Sans Mono" font-weight="bold" font-size="13" fill="#16202c">figure3e_run.py</text><text x="30" y="456" font-family="DejaVu Sans" font-size="11" fill="#5b6472">writes</text><text x="30" y="470" font-family="DejaVu Sans" font-size="11" fill="#5b6472">runs/&lt;arm&gt;/drift/&lt;dataset&gt;_seed0_&lt;rule&gt;.json:</text><text x="30" y="484" font-family="DejaVu Sans" font-size="11" fill="#5b6472">28 raw trajectories on the seven</text><text x="30" y="498" font-family="DejaVu Sans" font-size="11" fill="#5b6472">real datasets (the paper's 3c)</text><rect x="270" y="418" width="230" height="98" rx="6" fill="#fff8e6" stroke="#16202c" stroke-width="1"/><text x="280" y="440" font-family="DejaVu Sans Mono" font-weight="bold" font-size="13" fill="#16202c">figure3e_score.py</text><text x="280" y="456" font-family="DejaVu Sans" font-size="11" fill="#5b6472">writes drift/scores/&lt;trajectory&gt;.json:</text><text x="280" y="470" font-family="DejaVu Sans" font-size="11" fill="#5b6472">hidden-fold scores only (real data</text><text x="280" y="484" font-family="DejaVu Sans" font-size="11" fill="#5b6472">has no fresh draw)</text><rect x="520" y="418" width="230" height="98" rx="6" fill="#f4f6f9" stroke="#16202c" stroke-width="1"/><text x="530" y="440" font-family="DejaVu Sans Mono" font-weight="bold" font-size="13" fill="#16202c">figure3a_create.py --symlog</text><text x="530" y="456" font-family="DejaVu Sans" font-size="11" fill="#5b6472">the panel-a script on the real-data</text><text x="530" y="470" font-family="DejaVu Sans" font-size="11" fill="#5b6472">trajectories; writes figure3e.png</text><line x1="250" y1="467" x2="268" y2="467" stroke="#16202c" stroke-width="1.4" marker-end="url(#arr)"/><line x1="500" y1="467" x2="518" y2="467" stroke="#16202c" stroke-width="1.4" marker-end="url(#arr)"/><text x="20" y="554" font-family="DejaVu Sans" font-size="12" font-weight="bold" fill="#5b6472">imported by every step</text><rect x="20" y="566" width="980" height="46" rx="6" fill="#eef7f1" stroke="#16202c" stroke-width="1"/><text x="30" y="588" font-family="DejaVu Sans Mono" font-weight="bold" font-size="13" fill="#16202c">figure3_protocols.py</text><text x="290" y="587" font-family="DejaVu Sans" font-size="11" fill="#5b6472">the two drift arms as data: starting models, rules, rounds, flags; MATRIX_ARMS names panel c's census arm</text><text x="290" y="601" font-family="DejaVu Sans" font-size="11" fill="#5b6472">(figure2/figure2_protocols.py)</text><rect x="20" y="622" width="980" height="34" rx="6" fill="#eef7f1" stroke="#16202c" stroke-width="1"/><text x="30" y="644" font-family="DejaVu Sans Mono" font-weight="bold" font-size="13" fill="#16202c">figure3_run.py / figure3_score.py</text><text x="290" y="643" font-family="DejaVu Sans" font-size="11" fill="#5b6472">the drift engine the thin a, b and e files call: one proposer step per round, the rule decides, scores in side files</text><rect x="20" y="666" width="980" height="46" rx="6" fill="#eef7f1" stroke="#16202c" stroke-width="1"/><text x="30" y="688" font-family="DejaVu Sans Mono" font-weight="bold" font-size="13" fill="#16202c">figure3_common.py</text><text x="290" y="687" font-family="DejaVu Sans" font-size="11" fill="#5b6472">reading trajectories, the Δ a round is drawn at, counting latent sites; rule names, colours and the label rule from</text><text x="290" y="701" font-family="DejaVu Sans" font-size="11" fill="#5b6472">figure2/figure2_common.py</text></svg>